name: lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  subagent-dispatch-lint:
    name: Subagent Dispatch Rules Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run subagent-dispatch-lint.sh
        shell: bash
        run: |
          chmod +x tests/subagent-dispatch-lint.sh
          ./tests/subagent-dispatch-lint.sh

  bats-tests:
    name: Bats Tests (all *.bats)
    runs-on: ubuntu-latest
    # The bats job is the critical path of CI. Each shard runs 1/N of the files
    # (tests/run-all-bats.sh assigns every file to exactly one shard); the shard
    # values must be 1..N so that all shards together run every file.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bats + jq
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Run tests/run-all-bats.sh --strict
        shell: bash
        env:
          RUN_ALL_BATS_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          chmod +x tests/run-all-bats.sh
          ./tests/run-all-bats.sh --strict

  node-tests:
    name: Node Unit Tests (all *.test.mjs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install dependencies
        shell: bash
        run: npm ci
      - name: Run tests/run-node-tests.sh --strict
        shell: bash
        run: |
          chmod +x tests/run-node-tests.sh
          ./tests/run-node-tests.sh --strict
